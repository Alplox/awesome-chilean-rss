name: Check Format

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'feeds-database.json'
      - 'watchlist.json'
      - 'categories.json'
      - 'regions.json'
      - 'scripts/**'
      - 'dist/opml/chilean-rss.opml'
      - 'dist/opml/chilean-rss-nested.opml'
      - 'README.md'
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  format:
    name: Validate JSON, OPML and check sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run ci
