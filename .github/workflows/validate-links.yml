name: Validate RSS Links

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'README.md'
      - 'chilean-rss.opml'
      - 'feeds-database.json'
      - 'scripts/**'
      - '.github/workflows/validate-links.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'README.md'
      - 'chilean-rss.opml'
      - 'feeds-database.json'
      - 'scripts/**'

jobs:
  ci:
    name: Validate and check sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Validate feed URLs
        run: npm run validate -- --automatic
        timeout-minutes: 15
      - run: npm run ci
