name: Validate RSS Links

on: workflow_dispatch

jobs:
  validate:
    name: Validate feed URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run validate -- --automatic
